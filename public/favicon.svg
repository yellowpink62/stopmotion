<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Fundo com o azul característico do Vite -->
  <rect width="256" height="256" rx="56" fill="#646cff"/>
  
  <!-- Tira de filme central -->
  <rect x="48" y="24" width="160" height="208" rx="12" fill="#ffffff"/>
  
  <!-- Furos do rolo de filme - Esquerda -->
  <circle cx="68" cy="56" r="8" fill="#646cff"/>
  <circle cx="68" cy="128" r="8" fill="#646cff"/>
  <circle cx="68" cy="200" r="8" fill="#646cff"/>
  
  <!-- Furos do rolo de filme - Direita -->
  <circle cx="188" cy="56" r="8" fill="#646cff"/>
  <circle cx="188" cy="128" r="8" fill="#646cff"/>
  <circle cx="188" cy="200" r="8" fill="#646cff"/>
  
  <!-- Elemento em movimento (Stop Motion) -->
  <!-- Frame 1: Apagado e na esquerda -->
  <rect x="96" y="44" width="24" height="24" rx="4" fill="#242424" opacity="0.2"/>
  
  <!-- Frame 2: Mais visível e no centro -->
  <rect x="116" y="116" width="24" height="24" rx="4" fill="#242424" opacity="0.5"/>
  
  <!-- Frame 3: Totalmente sólido e na direita -->
  <rect x="136" y="188" width="24" height="24" rx="4" fill="#242424"/>
</svg>
